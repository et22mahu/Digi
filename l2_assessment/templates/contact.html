<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap" rel="stylesheet">

    <title>Contact Us</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">🏛️ The Mythology Bodleian</a>

    <ul class="navbar-links">
        <li><a href="/">Home</a></li>
        <li><a href="/search?query=">Browse All</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>
</nav>

<h1 class="main-title">Contact Us</h1>

<div class="contact-container">

    <p class="contact-text">
        Found an error? Have a suggestion for a new creature? We'd love to hear from you.
    </p>

    <form action="/submit_contact" method="POST" class="contact-form">

        <input
            type="text"
            name="name"
            placeholder="Your name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your email"
            required
        >

        <select name="type" required>
            <option value="">Select a category</option>
            <option>Suggestion</option>
            <option>Complaint</option>
            <option>Bug Report</option>
            <option>Other</option>
        </select>

        <textarea
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

</body>
</html>
